<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#a29bfe"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Shield outline -->
  <path d="M256 80 L400 160 L400 280 C400 360 340 420 256 440 C172 420 112 360 112 280 L112 160 Z" 
        fill="none" stroke="url(#accent)" stroke-width="12" stroke-linejoin="round"/>
  <!-- Lock body -->
  <rect x="200" y="260" width="112" height="90" rx="12" fill="url(#accent)"/>
  <!-- Lock shackle -->
  <path d="M220 260 L220 220 C220 190 240 170 256 170 C272 170 292 190 292 220 L292 260" 
        fill="none" stroke="url(#accent)" stroke-width="16" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="256" cy="300" r="10" fill="#0a0a0f"/>
  <rect x="251" y="305" width="10" height="20" rx="3" fill="#0a0a0f"/>
</svg>
